name: 유가 수집 및 배포

on:
  schedule:
    # 매일 10:20 KST (01:20 UTC). 오피넷 과거 판매가격은 전일분이 오전에 올라온다.
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "수집할 기준일 (YYYYMMDD, 비우면 어제)"
        required: false
        type: string

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 잡 수준에 둬야 step의 if 조건에서 볼 수 있다.
    env:
      OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Playwright 크로미움 설치
        run: npx playwright install --with-deps chromium

      # 명단·임계값·오피넷 키를 Supabase 에서 내려받는다. 미설정이면 저장소에
      # 커밋된 파일을 그대로 쓴다. 실패해도 파이프라인을 세우지 않는다.
      - name: Supabase 에서 명단·설정 내려받기
        continue-on-error: true
        run: npm run supabase:pull

      # 오피넷 다운로드 페이지는 NetFunnel 대기열을 통과해야 한다. 간헐적 실패가
      # 정상 범주라서 실패해도 워크플로를 죽이지 않고, 직전 커밋된 데이터를 유지한다.
      - name: 전국 주유소 가격 수집
        id: collect
        continue-on-error: true
        run: npm run collect ${{ inputs.date }}

      - name: 착한주유소 코드 매칭
        if: steps.collect.outcome == 'success'
        run: npm run match

      # 오피넷 키가 등록돼 있으면 주유소 좌표를 채운다. 없으면 통째로 건너뛰고
      # 지도 핀은 이미 확보된 좌표만 찍는다.
      - name: 주유소 좌표 보강
        if: steps.collect.outcome == 'success' && env.OPINET_API_KEY != ''
        continue-on-error: true
        run: npm run coords

      - name: 집계 및 신호등 판정
        if: steps.collect.outcome == 'success'
        run: npm run aggregate

      # 449곳 × 4유종만 올린다. service_role 키가 없으면 건너뛴다.
      - name: 판정 결과 Supabase 적재
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: npm run supabase:push

      - name: 결과 커밋
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data data/station-index.json data/station-mapping.json data/match-report.md data/station-coords.json data/good-stations.json data/thresholds.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 유가 데이터 갱신 ($(date -u -d '+9 hours' '+%Y-%m-%d'))"
            git push
          fi

      - name: 수집 실패 알림
        if: steps.collect.outcome != 'success'
        run: |
          echo "::warning::오피넷 수집에 실패했습니다. 직전 데이터로 현황판이 유지됩니다."

      # 배경 지도 타일. 시크릿이 비어 있으면 OpenStreetMap으로 떨어진다.
      #
      # VITE_ 접두사가 붙은 값은 빌드 시 클라이언트 번들에 그대로 박힌다. 브이월드
      # 키는 원래 공개되는 값이고 도메인 제한으로 보호하는 방식이라 문제 없지만,
      # 저장소 소스에 두지 않기 위해 시크릿으로 받는다.
      - name: 정적 사이트 빌드
        run: npm run build
        env:
          VITE_TILE_URL: ${{ secrets.VITE_TILE_URL }}
          VITE_TILE_ATTRIBUTION: ${{ secrets.VITE_TILE_ATTRIBUTION }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
