name: 유가 수집 및 배포

on:
  schedule:
    # 하루 두 번 돈다. 수집 단계가 '어제~오늘' 을 한 번에 받아 그중 다 올라온
    # 가장 최근 날짜를 쓰기 때문에, 아침에는 대개 전일분이 잡히고 저녁에는
    # 당일분이 잡힌다.
    #
    # 아침 10:20 KST (01:20 UTC) — 전일분 확보
    - cron: "20 1 * * *"
    # 저녁 19:30 KST (10:30 UTC) — 당일분 확보.
    # 오피넷은 당일분을 하루에 걸쳐 채운다. 9월 5일 17시에 이미 10,223건으로
    # 전날(10,237건)과 거의 같았다.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "수집할 기준일 (YYYYMMDD, 비우면 어제~오늘 중 최신)"
        required: false
        type: string
      skip_collect:
        description: "수집 건너뛰고 배포만 (커밋된 데이터 사용)"
        required: false
        default: false
        type: boolean

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 잡 수준에 둬야 step의 if 조건에서 볼 수 있다.
    env:
      OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
      VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Playwright 크로미움 설치
        run: npx playwright install --with-deps chromium

      # 명단·임계값·오피넷 키를 Supabase 에서 내려받는다. 미설정이면 저장소에
      # 커밋된 파일을 그대로 쓴다. 실패해도 파이프라인을 세우지 않는다.
      - name: Supabase 에서 명단·설정 내려받기
        if: ${{ !inputs.skip_collect }}
        continue-on-error: true
        run: npm run supabase:pull

      # 오피넷 다운로드 페이지는 NetFunnel 대기열을 통과해야 한다. 간헐적 실패가
      # 정상 범주라서 실패해도 워크플로를 죽이지 않고, 직전 커밋된 데이터를 유지한다.
      # 코드만 바뀌었을 때는 수집을 건너뛴다. 가격은 하루 한 번이면 충분하고,
      # NetFunnel 대기열이 길면 20분 넘게 잡혀 있기도 한다.
      # 이 단계를 건너뛰면 뒤따르는 데이터 단계들도 자동으로 빠지고
      # (outcome 이 'success' 가 아니게 된다) 빌드·배포만 돌아간다.
      - name: 전국 주유소 가격 수집
        id: collect
        if: ${{ !inputs.skip_collect }}
        continue-on-error: true
        run: npm run collect ${{ inputs.date }}

      - name: 착한주유소 코드 매칭
        if: steps.collect.outcome == 'success'
        run: npm run match

      # 좌표 보강.
      #
      # 브이월드는 여기서 돌리지 않는다. GitHub 러너(미국 IP)에서 호출하면
      # fetch failed / 502 로 전건 실패한다 — 446건 전부 그랬다. 국내에서는
      # 정상 응답하므로 해외 IP 차단으로 보인다.
      #
      # 애초에 좌표는 고정값이라 매일 받을 이유가 없다. 국내에서 한 번
      # `npm run coords:vworld` 로 채워 커밋하면 그 파일을 계속 쓴다.
      #
      # 오피넷은 주유소코드로 정확한 값을 준다. 키가 살아 있으면 여기서 돌린다.
      # 일일 한도(일반 API 300건)가 있어 한 번에 250건씩 끊어 받는다.
      - name: 주유소 좌표 보강 (오피넷)
        if: steps.collect.outcome == 'success' && env.OPINET_API_KEY != ''
        continue-on-error: true
        run: npm run coords

      - name: 집계 및 신호등 판정
        if: steps.collect.outcome == 'success'
        run: npm run aggregate

      # 449곳 × 4유종만 올린다. service_role 키가 없으면 건너뛴다.
      - name: 판정 결과 Supabase 적재
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: npm run supabase:push

      - name: 결과 커밋
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data data/raw data/station-index.json data/station-mapping.json data/match-report.md data/station-coords.json data/good-stations.json data/thresholds.json data/history.json
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi

          git commit -m "chore: 유가 데이터 갱신 ($(date -u -d '+9 hours' '+%Y-%m-%d'))"

          # 체크아웃과 푸시 사이에 사람이 밀어 넣으면 non-fast-forward 로 거절된다.
          # 수집은 1분이면 끝나지만 그 사이에 실제로 부딪혔다(run 33969060217).
          # 데이터 파일은 우리가 방금 새로 만든 것이 정답이므로, 당겨서 우리
          # 커밋을 위로 올리고 다시 민다.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "푸시 거절 — 원격을 당겨 다시 시도합니다 ($i/3)"
            git pull --rebase --autostash origin main || exit 1
          done

          echo "::error::세 번 시도했지만 푸시하지 못했습니다."
          exit 1

      - name: 수집 건너뜀 안내
        if: ${{ inputs.skip_collect }}
        run: echo "::notice::수집을 건너뛰고 커밋된 데이터로 배포합니다."

      - name: 수집 실패 알림
        if: ${{ !inputs.skip_collect && steps.collect.outcome != 'success' }}
        run: |
          echo "::warning::오피넷 수집에 실패했습니다. 직전 데이터로 현황판이 유지됩니다."

      # 배경 지도 타일. 시크릿이 비어 있으면 OpenStreetMap으로 떨어진다.
      #
      # VITE_ 접두사가 붙은 값은 빌드 시 클라이언트 번들에 그대로 박힌다. 브이월드
      # 키는 원래 공개되는 값이고 도메인 제한으로 보호하는 방식이라 문제 없지만,
      # 저장소 소스에 두지 않기 위해 시크릿으로 받는다.
      - name: 정적 사이트 빌드
        run: npm run build
        env:
          VITE_TILE_URL: ${{ secrets.VITE_TILE_URL }}
          VITE_TILE_ATTRIBUTION: ${{ secrets.VITE_TILE_ATTRIBUTION }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
